# ============================================================================
# CV - Deploy B2: Oracle nginx reverse proxy -> N100 container via Tailscale
# Domain: brianpotosi.com (www redirects to apex)
# ============================================================================
# This file goes on the ORACLE server (the public front door), NOT on the N100.
# Flow: internet -> Oracle nginx (this file) -> Tailscale -> N100 container
#       (started on the N100 with: docker compose -f deploy/docker-compose.yml up -d)
#
# Install (works with every nginx layout, no sites-enabled needed):
#   sudo cp deploy/nginx-cv-reverseproxy.conf /etc/nginx/conf.d/cv.conf
#   sudo sed -i 's|100.x.y.z|TUO_IP_TAILSCALE|' /etc/nginx/conf.d/cv.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The ONLY value to change: proxy_pass -> the N100 Tailscale IP.
# Find it on the N100 with:  tailscale ip -4      (e.g. 100.101.102.103)
# With MagicDNS enabled you may use the machine name instead (e.g. http://n100:8080).
#
# HTTPS, after the DNS A records for brianpotosi.com and www.brianpotosi.com
# point to the Oracle public IP:
#   sudo certbot --nginx -d brianpotosi.com -d www.brianpotosi.com
#
# Trade-off vs Deploy A (static files on Oracle): with this variant the CV is
# unreachable whenever the home link or the N100 is down.
# ============================================================================

# www -> apex
server {
    listen 80;
    listen [::]:80;
    server_name www.brianpotosi.com;
    return 301 http://brianpotosi.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name brianpotosi.com;

    # --- Security headers (applied at the front door for the whole site) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    location / {
        # EDIT: N100 target over Tailscale (the only value to change).
        # Preferred: Tailscale IP (stable per node)  -> http://100.x.y.z:8080
        # Or with MagicDNS enabled                   -> http://n100:8080
        proxy_pass http://100.x.y.z:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast if the home link is down instead of hanging the browser.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
