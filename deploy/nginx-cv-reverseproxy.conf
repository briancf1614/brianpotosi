# ============================================================================
# CV - Deploy B2: Oracle nginx reverse proxy -> N100 container via Tailscale
# ============================================================================
# This file goes on the ORACLE server (the public front door), NOT on the N100.
# Flow: internet -> Oracle nginx (this file) -> Tailscale -> N100 container
#       (started with: docker compose -f deploy/docker-compose.yml up -d)
#
# Prerequisites:
#   1. Tailscale installed and connected on BOTH Oracle and the N100.
#   2. The CV container running on the N100 (default port 8080).
#   3. Find the N100 Tailscale address on the N100:  tailscale ip -4
#      (e.g. 100.x.y.z). Alternatively, if MagicDNS is enabled, you can use
#      the machine name (e.g. http://n100:8080) instead of the IP.
#
# Enable (Debian/Ubuntu layout, same as nginx-cv.conf):
#   sudo cp deploy/nginx-cv-reverseproxy.conf /etc/nginx/sites-available/cv.conf
#   sudo ln -s /etc/nginx/sites-available/cv.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: after pointing the DNS record at the Oracle public IP:
#   sudo certbot --nginx -d cv.example.com
#
# Trade-off vs Deploy A (static files on Oracle): with this variant the CV is
# unreachable whenever the home link or the N100 is down. Static-on-Oracle has
# no such dependency.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name cv.example.com;    # EDIT: your domain

    # --- Security headers (applied at the front door for the whole site) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    location / {
        # EDIT: N100 target over Tailscale.
        # Preferred: Tailscale IP (stable per node)  -> http://100.x.y.z:8080
        # Or with MagicDNS enabled                   -> http://n100:8080
        proxy_pass http://100.x.y.z:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast if the home link is down instead of hanging the browser.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
