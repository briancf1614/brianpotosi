# nginx server block — Brian Potosi static CV
#
# HOW TO USE
# ----------
# Debian/Ubuntu (sites-available pattern):
#   1) sudo cp deploy/nginx-cv.conf /etc/nginx/sites-available/cv.conf
#   2) sudo ln -s /etc/nginx/sites-available/cv.conf /etc/nginx/sites-enabled/
#   3) sudo nginx -t && sudo systemctl reload nginx
#
# RHEL/Fedora/Alpine style (conf.d pattern):
#   sudo cp deploy/nginx-cv.conf /etc/nginx/conf.d/cv.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# EDIT the server_name and the root path below before enabling.
#
# HTTPS: enable this block first, then run certbot which will install the
# certificates and the HTTP->HTTPS redirect for you:
#   sudo certbot --nginx -d cv.example.com
# (Or keep the redirect below and switch the paths certbot generates.)

# --- HTTP: redirect everything to HTTPS -------------------------------------
# (Comment this block out if you serve plain HTTP on a LAN / before TLS setup.)
server {
    listen 80;
    listen [::]:80;
    # EDIT: your domain
    server_name cv.example.com;

    # Certbot will manage this location during `certbot --nginx`
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the static CV site ----------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # EDIT: your domain
    server_name cv.example.com;

    # EDIT: where the site lives on disk (see README: git clone or rsync here)
    root /var/www/cv;
    index index.html;

    # EDIT: certificate paths (created by certbot / your CA)
    ssl_certificate     /etc/letsencrypt/live/cv.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cv.example.com/privkey.pem;

    # --- Security headers ----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Gzip: compress text assets on the fly --------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # --- Caching ---------------------------------------------------------------
    # Fingerprinted assets: cache hard, tell browsers they never change.
    # (Safe even without hashes in filenames: bump the version manually
    #  with cache-busting query strings, e.g. style.css?v=2, when needed.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Re-apply security headers: add_header in a nested location resets them
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # HTML: always revalidate so edits show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Everything else (the root document and friendly 404s)
    location / {
        try_files $uri $uri/ =404;
    }
}
