<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Monogram favicon: "BP" on a dark rounded square with the site gradient -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0d1a"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#g)" stroke-opacity="0.45" stroke-width="2"/>
  <text x="32" y="42" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="url(#g)">BP</text>
</svg>
